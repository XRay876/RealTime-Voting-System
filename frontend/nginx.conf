server {
    listen 80;

    absolute_redirect off;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # location /api/v1/auth/ {
    #     proxy_pass http://auth-service:8080/api/v1/auth/;
    #     proxy_set_header Host $http_host;
    # }

    # location /api/v1/users/ {
    #     proxy_pass http://auth-service:8080/api/v1/users/;
    #     proxy_set_header Host $http_host;
    # }

    # location /api/v1/admin/users/ {
    #     proxy_pass http://auth-service:8080/api/v1/admin/users/;
    #     proxy_set_header Host $http_host;
    # }
    location /api/v1 {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api/polls {
        proxy_pass http://polls-service:8080/api/polls;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/options {
        proxy_pass http://polls-service:8080/api/options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws-voting/ {
        proxy_pass http://polls-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}