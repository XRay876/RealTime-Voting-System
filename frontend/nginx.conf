server {
    listen 80;

    absolute_redirect off;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080/api/v1/auth/;
        proxy_set_header Host $http_host;
    }

    location /api/v1/users/ {
        proxy_pass http://auth-service:8080/api/v1/users/;
        proxy_set_header Host $http_host;
    }

    location /api/v1/admin/users/ {
        proxy_pass http://auth-service:8080/api/v1/admin/users/;
        proxy_set_header Host $http_host;
    }
    
    location /api/polls {
        proxy_pass http://polls-service:8080/api/polls;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}