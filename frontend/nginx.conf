server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080/api/v1/auth/;
    }

    location /api/users/ {
        proxy_pass http://auth-service:8080/api/v1/users/;
    }

    location /api/admin/users/ {
        proxy_pass http://auth-service:8080/api/v1/admin/users/;
    }

    
    location /api/polls/ {
        proxy_pass http://polls-service:8081/api/polls/;
    }
}